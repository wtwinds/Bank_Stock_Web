<nav class="navbar navbar-expand-lg shadow" style="background-color: #0d1b2a;">
    <div class="container">

        <a class="navbar-brand fw-bold text-white" href="/bank/login">
            🏦 SmartPay Bank
        </a>

        {% if session.get('bank_user_id') %}
        <div class="ms-auto d-flex align-items-center">

            <span class="text-white me-3">
                Role: {{ session.get('bank_role') }}
            </span>

            <!-- DARK MODE BUTTON -->
            <button onclick="toggleDarkMode()" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-moon-fill"></i>
            </button>

            <a href="/bank/logout" class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>
        {% endif %}

    </div>
</nav>

<!-- BOOTSTRAP ICON CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script>

    function toggleDarkMode() {

        document.body.classList.toggle("dark-mode")

        if (document.body.classList.contains("dark-mode")) {
            localStorage.setItem("theme", "dark")
        } else {
            localStorage.setItem("theme", "light")
        }

    }

    window.onload = function () {

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode")
        }

    }

</script>
