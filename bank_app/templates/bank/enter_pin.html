<!DOCTYPE html>
<html>

<head>
    <title>Enter PIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5 col-md-4">
        <div class="card shadow p-4 text-center">

            <h4>Enter Your PIN</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
            <div class="alert alert-{{category}} mt-2">{{msg}}</div>
            {% endfor %}
            {% endwith %}

            <form method="post">
                <input type="password" name="pin" class="form-control mt-3" placeholder="Enter PIN" required>

                <button class="btn btn-primary mt-3 w-100">Pay</button>

                <!-- ✅ BACK TO TRANSFER BUTTON -->
                <a href="/bank/transfer" class="btn btn-outline-secondary mt-2 w-100">
                    ← Back to Transfer
                </a>
            </form>

        </div>
    </div>

</body>

</html>
